<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a dog and cat resting together beneath a warm sun, surrounded by paw prints">
  <defs>
    <linearGradient id="skyLg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF6EC"/>
      <stop offset="100%" stop-color="#F0E8D3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#skyLg)"/>

  <!-- sun -->
  <circle cx="960" cy="180" r="110" fill="#E8792B" opacity="0.9"/>
  <circle cx="960" cy="180" r="150" fill="none" stroke="#E8792B" stroke-width="2" opacity="0.3"/>

  <!-- rolling ground -->
  <path d="M0 620 C 250 560, 420 660, 650 610 C 850 570, 1000 640, 1200 590 L1200 800 L0 800 Z" fill="#2C6B4F"/>
  <path d="M0 660 C 300 610, 500 690, 750 650 C 950 620, 1050 670, 1200 640 L1200 800 L0 800 Z" fill="#1B4D37"/>

  <!-- scattered paw prints -->
  <g fill="#1B4D37" opacity="0.25">
    <g transform="translate(120,520) scale(0.7)"><circle cx="16" cy="28" r="11"/><ellipse cx="2" cy="10" rx="5" ry="7"/><ellipse cx="16" cy="2" rx="5.5" ry="7.5"/><ellipse cx="30" cy="10" rx="5" ry="7"/></g>
    <g transform="translate(230,470) scale(0.55) rotate(15)"><circle cx="16" cy="28" r="11"/><ellipse cx="2" cy="10" rx="5" ry="7"/><ellipse cx="16" cy="2" rx="5.5" ry="7.5"/><ellipse cx="30" cy="10" rx="5" ry="7"/></g>
    <g transform="translate(330,540) scale(0.65) rotate(-10)"><circle cx="16" cy="28" r="11"/><ellipse cx="2" cy="10" rx="5" ry="7"/><ellipse cx="16" cy="2" rx="5.5" ry="7.5"/><ellipse cx="30" cy="10" rx="5" ry="7"/></g>
  </g>

  <!-- resting dog (simple rounded shapes) -->
  <g transform="translate(560,470)">
    <ellipse cx="90" cy="150" rx="150" ry="70" fill="#B9713C"/>
    <circle cx="230" cy="90" r="70" fill="#B9713C"/>
    <ellipse cx="185" cy="55" rx="18" ry="30" fill="#8F5527" transform="rotate(-25 185 55)"/>
    <ellipse cx="275" cy="55" rx="18" ry="30" fill="#8F5527" transform="rotate(25 275 55)"/>
    <circle cx="255" cy="95" r="5" fill="#241C14"/>
    <ellipse cx="270" cy="115" rx="10" ry="7" fill="#241C14"/>
  </g>

  <!-- resting cat (simple rounded shapes) -->
  <g transform="translate(360,500)">
    <ellipse cx="70" cy="130" rx="110" ry="55" fill="#EDE7D6"/>
    <circle cx="170" cy="80" r="52" fill="#EDE7D6"/>
    <path d="M140 45 L150 15 L165 48 Z" fill="#EDE7D6"/>
    <path d="M195 45 L205 15 L215 50 Z" fill="#EDE7D6"/>
    <circle cx="185" cy="82" r="4" fill="#241C14"/>
    <circle cx="160" cy="82" r="4" fill="#241C14"/>
  </g>
</svg>
